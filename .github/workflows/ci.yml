name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Unit tests never open a socket; these only satisfy settings validation.
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/eventpulse
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only-not-a-real-secret
      JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only-not-a-real-secret
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      # Advisory for now: there are ~19 pre-existing findings (dead imports,
      # SQLAlchemy's `== True` filter idiom). Reported, but not a merge blocker
      # until they are cleaned up.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check app --output-format concise

      - name: Unit tests
        # tests/integration drives a live server over the network and is
        # skipped here; it runs under docker compose instead.
        run: pytest tests/unit -q

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
