services:
  - type: static
    name: eventpulse-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://eventpulse-backend-6la6.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://eventpulse-backend-6la6.onrender.com/api/v1
      - key: VITE_ENV
        value: production
