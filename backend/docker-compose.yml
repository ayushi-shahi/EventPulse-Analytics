# backend/docker-compose.yml
#
# Fix summary vs original:
# 1. celery_worker healthcheck: replaced flaky `celery inspect ping` with
#    a lightweight Redis ping — works without a running broker connection
# 2. celery_beat: no longer depends on celery_worker being healthy —
#    beat only needs Redis (broker) and Postgres, not the worker
# 3. Added start_period to all healthchecks so Docker doesn't mark
#    services unhealthy before they've had time to initialise
# 4. eventpulse_api: added alembic upgrade head before uvicorn so
#    migrations always run on startup (matches Dockerfile CMD pattern)

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  eventpulse_postgres:
    image: postgres:15-alpine
    container_name: eventpulse_db
    environment:
      POSTGRES_USER: eventpulse_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: EventPulse
    ports:
      - "5434:5432"
    volumes:
      - eventpulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpulse_user -d EventPulse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s      # give Postgres time to initialise on first run
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - eventpulse_network

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  eventpulse_redis:
    image: redis:7-alpine
    container_name: eventpulse_redis
    ports:
      - "6381:6379"
    volumes:
      - eventpulse_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - eventpulse_network

  # ---------------------------------------------------------------------------
  # FastAPI application
  # ---------------------------------------------------------------------------
  eventpulse_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventpulse_api
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgresql+asyncpg://eventpulse_user:${DB_PASSWORD:-password}@eventpulse_postgres:5432/EventPulse
      - REDIS_URL=redis://eventpulse_redis:6379/0
      - CELERY_BROKER_URL=redis://eventpulse_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://eventpulse_redis:6379/1
      - APP_ENV=production
      - DEBUG=False
      - LOG_LEVEL=INFO
    ports:
      - "8002:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      eventpulse_postgres:
        condition: service_healthy
      eventpulse_redis:
        condition: service_healthy
    # Run migrations first, then start the server
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s      # give alembic + uvicorn time to start
    networks:
      - eventpulse_network

  # ---------------------------------------------------------------------------
  # Celery worker
  # ---------------------------------------------------------------------------
  eventpulse_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventpulse_worker
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgresql+asyncpg://eventpulse_user:${DB_PASSWORD:-password}@eventpulse_postgres:5432/EventPulse
      - REDIS_URL=redis://eventpulse_redis:6379/0
      - CELERY_BROKER_URL=redis://eventpulse_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://eventpulse_redis:6379/1
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      eventpulse_postgres:
        condition: service_healthy
      eventpulse_redis:
        condition: service_healthy
      eventpulse_api:
        condition: service_healthy   # ensures migrations ran before worker starts
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    healthcheck:
      # Inline Python TCP check — no redis-cli in python:3.11-slim
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('eventpulse_redis',6379),timeout=3); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - eventpulse_network

  # ---------------------------------------------------------------------------
  # Celery beat (scheduler)
  # ---------------------------------------------------------------------------
  eventpulse_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventpulse_beat
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgresql+asyncpg://eventpulse_user:${DB_PASSWORD:-password}@eventpulse_postgres:5432/EventPulse
      - REDIS_URL=redis://eventpulse_redis:6379/0
      - CELERY_BROKER_URL=redis://eventpulse_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://eventpulse_redis:6379/1
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      # Beat only needs the broker (Redis) and DB to be healthy.
      # It does NOT need the worker to be healthy — beat just enqueues
      # tasks into Redis; workers pick them up independently.
      eventpulse_postgres:
        condition: service_healthy
      eventpulse_redis:
        condition: service_healthy
      eventpulse_api:
        condition: service_healthy   # ensures migrations ran before beat starts
    command: celery -A beat.celery_app beat --loglevel=info
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      # Inline Python TCP check — no redis-cli in python:3.11-slim
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('eventpulse_redis',6379),timeout=3); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - eventpulse_network

# ---------------------------------------------------------------------------
# Volumes & networks
# ---------------------------------------------------------------------------

volumes:
  eventpulse_postgres_data:
  eventpulse_redis_data:

networks:
  eventpulse_network:
    driver: bridge