version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: eventpulse_db
    environment:
      POSTGRES_USER: eventpulse_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: EventPulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpulse_user"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - eventpulse_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: eventpulse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - eventpulse_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventpulse_api
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgresql+asyncpg://eventpulse_user:${DB_PASSWORD:-password}@postgres:5432/EventPulse
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - DEBUG=False
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventpulse_network

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventpulse_worker
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgresql+asyncpg://eventpulse_user:${DB_PASSWORD:-password}@postgres:5432/EventPulse
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eventpulse_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventpulse_beat
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgresql+asyncpg://eventpulse_user:${DB_PASSWORD:-password}@postgres:5432/EventPulse
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_healthy
    command: celery -A beat.celery_app beat --loglevel=info
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python /app/app/beat_health.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eventpulse_network

volumes:
  postgres_data:
  redis_data:

networks:
  eventpulse_network:
    driver: bridge
